global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: REPLACE_WITH_TELEGRAM_BOT_TOKEN
        chat_id: -1000000000000
        send_resolved: true
