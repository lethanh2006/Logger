global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [alertname, severity, team, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/alertmanager/discord_webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service, instance]
