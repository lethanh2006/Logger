global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/ME/NOW
        channel: "#backend-alerts"
        send_resolved: true
