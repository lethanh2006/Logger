global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: https://discord.com/api/webhooks/REPLACE_ME/REPLACE_ME
        send_resolved: true
