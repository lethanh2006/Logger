global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: backend-readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ["http://gateway:3000/health"]
        labels:
          service: gateway
      - targets: ["http://auth:4000/health"]
        labels:
          service: auth
      - targets: ["http://user:5000/health/ready"]
        labels:
          service: user
      - targets: ["http://mail:5001/health"]
        labels:
          service: mail
      - targets: ["http://chat:5002/health/ready"]
        labels:
          service: chat
      - targets: ["http://todo:5003/health/ready"]
        labels:
          service: todo
      - targets: ["http://workschedule:5004/health/ready"]
        labels:
          service: workschedule
      - targets: ["http://canteen:5005/health"]
        labels:
          service: canteen
      - targets: ["http://payment:5006/health/ready"]
        labels:
          service: payment
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: application-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
