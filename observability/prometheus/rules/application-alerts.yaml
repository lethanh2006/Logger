groups:
  - name: backend-application
    rules:
      - alert: BackendServiceUnavailable
        expr: probe_success{job="backend-readiness"} == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Backend service {{ $labels.service }} is not ready"
          description: "The readiness probe for {{ $labels.instance }} has failed for at least two minutes."
          dashboard: "http://127.0.0.1:3001/d/nrapp-service-reliability/service-reliability"

      - alert: BackendHttp5xxRatioHigh
        expr: |
          (
            sum by (service_name) (
              rate(http_server_request_duration_seconds_count{http_route!~"/health.*",http_response_status_code=~"5.."}[5m])
            )
            /
            clamp_min(
              sum by (service_name) (
                rate(http_server_request_duration_seconds_count{http_route!~"/health.*"}[5m])
              ),
              0.001
            )
          ) > 0.05
          and on (service_name)
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_route!~"/health.*"}[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "HTTP 5xx ratio is high on {{ $labels.service_name }}"
          description: "More than 5% of non-health requests returned 5xx for five minutes."
          dashboard: "http://127.0.0.1:3001/d/nrapp-service-reliability/service-reliability"

      - alert: BackendHttpLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (service_name, le) (
              rate(http_server_request_duration_seconds_bucket{http_route!~"/health.*"}[5m])
            )
          ) > 1.5
          and on (service_name)
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_route!~"/health.*"}[5m])
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "HTTP p95 latency is high on {{ $labels.service_name }}"
          description: "The p95 non-health request latency exceeded 1.5 seconds for ten minutes."
          dashboard: "http://127.0.0.1:3001/d/nrapp-service-reliability/service-reliability"

      - alert: BackendContainerOomKilled
        expr: |
          increase(container_oom_events_total{
            container_label_com_docker_compose_project="nrapp-backend",
            container_label_com_docker_compose_service!=""
          }[10m]) > 0
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Container {{ $labels.container_label_com_docker_compose_service }} had an OOM event"
          description: "cAdvisor observed an out-of-memory event during the last ten minutes."

      - alert: BackendContainerCpuThrottlingHigh
        expr: |
          (
            sum by (container_label_com_docker_compose_service) (
              rate(container_cpu_cfs_throttled_seconds_total{
                container_label_com_docker_compose_project="nrapp-backend",
                container_label_com_docker_compose_service!=""
              }[5m])
            )
            /
            clamp_min(
              sum by (container_label_com_docker_compose_service) (
                rate(container_cpu_usage_seconds_total{
                  container_label_com_docker_compose_project="nrapp-backend",
                  container_label_com_docker_compose_service!=""
                }[5m])
              ),
              0.001
            )
          ) > 0.25
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Container {{ $labels.container_label_com_docker_compose_service }} is heavily CPU-throttled"
          description: "CPU throttled time exceeded 25% of CPU usage for fifteen minutes."

      - alert: ContainerRestartLoop
        expr: |
          changes(
            (
              max by (container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
                container_start_time_seconds{
                  container_label_com_docker_compose_project=~"nrapp-backend|nrapp-observability",
                  container_label_com_docker_compose_service!=""
                }
              )
            )[15m:]
          ) > 2
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Container {{ $labels.container_label_com_docker_compose_service }} is restarting repeatedly"
          description: "The container start timestamp changed more than twice in fifteen minutes."

      - alert: ApplicationLogPipelineUnavailable
        expr: up{job=~"alloy|loki"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Application log pipeline component {{ $labels.job }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for at least two minutes."
