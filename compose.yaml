name: ${COMPOSE_PROJECT_NAME:-nrapp-observability}

services:
  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:?Set GRAFANA_ALERT_WEBHOOK_URL in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

networks:
  observability:
    driver: bridge

volumes:
  alloy_data:
  grafana_data:
  loki_data:
