name: ${OBSERVABILITY_COMPOSE_PROJECT_NAME:-nrapp-observability}

x-observability-defaults: &observability-defaults
  restart: ${OBSERVABILITY_RESTART_POLICY:-unless-stopped}
  stop_grace_period: ${OBSERVABILITY_STOP_GRACE_PERIOD:-15s}
  cpus: ${OBSERVABILITY_CPU_LIMIT:-1.0}
  mem_limit: ${OBSERVABILITY_MEMORY_LIMIT:-1g}
  logging:
    driver: local
    options:
      max-size: ${OBSERVABILITY_LOG_MAX_SIZE:-10m}
      max-file: ${OBSERVABILITY_LOG_MAX_FILE:-3}

services:
  jaeger:
    <<: *observability-defaults
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
    expose:
      - "4317"
      - "4318"
      - "8888"
      - "13133"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:13133/status",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  otel-collector:
    <<: *observability-defaults
    image: otel/opentelemetry-collector:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    expose:
      - "8888"
      - "8889"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  prometheus:
    <<: *observability-defaults
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - otel-collector
      - node-exporter
      - cadvisor
      - redis-exporter
      - postgres-exporter
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    <<: *observability-defaults
    image: prom/alertmanager:v0.34.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --data.retention=${ALERTMANAGER_RETENTION:-120h}
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - "${ALERTMANAGER_CONFIG_FILE:-./observability/alertmanager/alertmanager.yaml}:/etc/alertmanager/alertmanager.yaml:ro"
      - alertmanager_data:/alertmanager
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9093/-/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-exporter:
    <<: *observability-defaults
    image: prom/node-exporter:v1.11.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)(/.*)?
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    expose:
      - "9100"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9100/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    <<: *observability-defaults
    image: ghcr.io/google/cadvisor:v0.57.0
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - observability
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-exporter:
    <<: *observability-defaults
    image: oliver006/redis_exporter:v1.89.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-exporter:
    <<: *observability-defaults
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${PAYMENT_POSTGRES_USER:?Set PAYMENT_POSTGRES_USER in backend/.env}:${PAYMENT_POSTGRES_PASSWORD:?Set PAYMENT_POSTGRES_PASSWORD in backend/.env}@payment-postgres:5432/${PAYMENT_POSTGRES_DB:?Set PAYMENT_POSTGRES_DB in backend/.env}?sslmode=disable
    expose:
      - "9187"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    <<: *observability-defaults
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: "no"
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  alloy:
    <<: *observability-defaults
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: "no"
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345;
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    <<: *observability-defaults
    image: grafana/grafana:13.2.0
    restart: "no"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - alertmanager
      - loki
      - prometheus
      - jaeger
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-nrapp-observability}
    driver: bridge

volumes:
  alertmanager_data:
  alloy_data:
  grafana_data:
  loki_data:
  prometheus_data:
